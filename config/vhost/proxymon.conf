<VirtualHost *:@PANEL_PORT@>
    ServerName localhost
    DocumentRoot @WEB_ROOT@

    # Every Require below is loopback only, and pmsetup.sh renders paths and ports from proxymon.env.
    # RANGE does not grant access to the panel. To reach
    # the panel from the LAN, add your own range to each Require ip line and
    # change the Listen directive that the installer writes in ports.conf.

    # squidtool.sh writes its reports as root, so they live outside the web
    # tree. Served read-only from here, under the same LAN restriction.
    # Declared before /proxymon: Apache uses the first Alias that matches.
    Alias /proxymon/squidtool @TOOL_REPORT_DIR@
    <Directory @TOOL_REPORT_DIR@>
        Require ip 127.0.0.1
    </Directory>

    Alias /proxymon @WEB_ROOT@

    Alias /favicon.ico "@WEB_ROOT@/squidreports/assets/global/img/favicon.png"

    # General Config
    <Directory />
        Options FollowSymLinks
        DirectoryIndex index.php index.html index.htm
        Options +ExecCGI
        AllowOverride None

        # Protect sensitive file types across all proxymon subdirectories
        <FilesMatch "(?i)\.(env|ini|log|sh|sql|bak|backup|json|yaml|yml|key|pem|crt|conf|cfg|pm)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Panel-wide LAN restriction; module blocks below inherit and re-assert it
    <Directory @WEB_ROOT@>
        Require ip 127.0.0.1
        LimitRequestBody 1048576
    </Directory>

    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory "/usr/lib/cgi-bin">
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require ip 127.0.0.1
        LimitRequestBody 1048576
    </Directory>

    # Squidreports
    <Directory "@WEB_ROOT@/squidreports">
        DirectoryIndex index.cgi
        Options +ExecCGI +FollowSymLinks
        AddHandler cgi-script .cgi .pl
        AllowOverride None
        Require ip 127.0.0.1

        # These are library/cron scripts, not part of the report interface —
        # check-setup.pl leaks config paths, squidreports.pl is meant to be
        # run from cron, not invoked over HTTP as www-data.
        <FilesMatch "^(check-setup|squidreports|paths)\.pl$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Squidreports assets
    Alias /proxymon/squidreports/assets/ "@WEB_ROOT@/squidreports/assets/"
    Alias /proxymon/squidreports/tpl/ "@WEB_ROOT@/squidreports/tpl/"

    # Squidmon
    <Directory "@WEB_ROOT@/squidmon">
        DirectoryIndex squidmon.cgi
        Options +ExecCGI +FollowSymLinks
        AddHandler cgi-script .cgi .pl
        AllowOverride None
        Require ip 127.0.0.1
    </Directory>

    # Logview
    <Directory "@WEB_ROOT@/logview">
        DirectoryIndex index.php
        Options +FollowSymLinks
        AddHandler application/x-httpd-php .php
        AllowOverride None
        Require ip 127.0.0.1
    </Directory>

    # SquidAI
    Alias /squidai "@WEB_ROOT@/squidai"
    <Directory "@WEB_ROOT@/squidai">
        DirectoryIndex index.html
        Options +FollowSymLinks
        AddHandler application/x-httpd-php .php
        AllowOverride None
        Require ip 127.0.0.1
    </Directory>

    # Logview polls its own endpoint every second, so its requests are kept
    # out of the access log to stop them from drowning out everything else
    SetEnvIf Request_URI "^/proxymon/logview/api\.php$" dontlog
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:"
    ErrorLog ${APACHE_LOG_DIR}/proxymon_error.log
    CustomLog ${APACHE_LOG_DIR}/proxymon_access.log combined env=!dontlog
</VirtualHost>
