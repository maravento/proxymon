<VirtualHost *:@WARNING_PORT@>
    ServerAdmin webmaster@localhost
    DocumentRoot @WEB_ROOT@/warning

    ServerName captive.portal
    ServerAlias *

    <Directory @WEB_ROOT@/warning>
        DirectoryIndex warning.html
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Windows (NCSI - MSFT Connect Test)
    Alias /ncsi.txt @WEB_ROOT@/warning/warning.html
    Alias /connecttest.txt @WEB_ROOT@/warning/warning.html
    Alias /redirect @WEB_ROOT@/warning/warning.html
    Alias /msftconnecttest/redir.htm @WEB_ROOT@/warning/warning.html
    Alias /ncsi/redirect @WEB_ROOT@/warning/warning.html

    # Microsoft Edge (Chromium)
    Alias /captiveportal/generate_204 @WEB_ROOT@/warning/warning.html
    Alias /edge-captiveportal/generate_204 @WEB_ROOT@/warning/warning.html

    # Android (Google Captive Portal Check)
    Alias /generate_204 @WEB_ROOT@/warning/warning.html
    Alias /gen_204 @WEB_ROOT@/warning/warning.html
    Alias /mobile/status.php @WEB_ROOT@/warning/warning.html

    # Apple iOS - macOS
    Alias /hotspot-detect.html @WEB_ROOT@/warning/warning.html
    Alias /library/test/success.html @WEB_ROOT@/warning/warning.html
    Alias /success.txt @WEB_ROOT@/warning/warning.html
    Alias /hotspot.txt @WEB_ROOT@/warning/warning.html

    # Firefox Captive Portal
    Alias /captive-portal-success.html @WEB_ROOT@/warning/warning.html

    # GNOME / KDE (Linux)
    Alias /nmcheck.txt @WEB_ROOT@/warning/warning.html
    Alias /check_network_status.txt @WEB_ROOT@/warning/warning.html
    Alias /conncheck.html @WEB_ROOT@/warning/warning.html
    Alias /check_network.txt @WEB_ROOT@/warning/warning.html

    # Extras
    Alias /favicon.ico @WEB_ROOT@/warning/warning.html
    Alias /success.html @WEB_ROOT@/warning/warning.html
    Alias /success @WEB_ROOT@/warning/warning.html

    RewriteEngine On

    RewriteCond %{REQUEST_URI} !^/warning\.html$
    RewriteCond %{REQUEST_URI} !^/$
    RewriteRule ^.*$ /warning.html [L]

    SetEnvIf Remote_Addr "127\.0\.0\.1" dontlog
    SetEnvIf User-Agent ".*internal dummy connection.*" dontlog

    ErrorLog ${APACHE_LOG_DIR}/warning_error.log
    CustomLog ${APACHE_LOG_DIR}/warning_access.log combined env=!dontlog
</VirtualHost>
