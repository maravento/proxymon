<VirtualHost *:18080>
    ServerName localhost
    DocumentRoot /var/www/proxymon

    # 192.168.0.0/24 below is a safe default. pminstall.sh offers to replace
    # it with your real LAN range (RANGE in /etc/proxymon/proxymon.env) at
    # install time. If you keep the default, edit it manually here.

    Alias /proxymon /var/www/proxymon

    # General Config
    <Directory />
        Options FollowSymLinks
        DirectoryIndex index.php index.html index.htm
        Options +ExecCGI
        AllowOverride None

        # Protect sensitive file types across all proxymon subdirectories
        <FilesMatch "(?i)\.(env|ini|log|sh|sql|bak|backup|json|yaml|yml|key|pem|crt|conf|cfg)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Panel-wide LAN restriction; module blocks below inherit and re-assert it
    <Directory /var/www/proxymon>
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>

    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory "/usr/lib/cgi-bin">
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>

    # Lightsquid
    <Directory "/var/www/proxymon/lightsquid">
        DirectoryIndex index.cgi
        Options +ExecCGI +FollowSymLinks
        AddHandler cgi-script .cgi .pl
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1

        # These are library/cron scripts, not part of the report interface —
        # check-setup.pl leaks config paths, lightparser.pl is meant to be
        # run from cron, not invoked over HTTP as www-data.
        <FilesMatch "^(check-setup|lightparser)\.pl$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Lightsquid assets
    Alias /proxymon/lightsquid/assets/ "/var/www/proxymon/lightsquid/assets/"
    Alias /proxymon/lightsquid/tpl/ "/var/www/proxymon/lightsquid/tpl/"

    # Squidmon
    <Directory "/var/www/proxymon/squidmon">
        DirectoryIndex squidmon.cgi
        Options +ExecCGI +FollowSymLinks
        AddHandler cgi-script .cgi .pl
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>

    # Sarg
    <Directory "/var/www/proxymon/sarg/squid-reports">
        Options FollowSymLinks
        DirectoryIndex index.html
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>

    # Sqstat
    Alias /sqstat/ "/var/www/proxymon/sqstat/"
    <Directory "/var/www/proxymon/sqstat/">
        Options +ExecCGI +FollowSymLinks
        DirectoryIndex index.php sqstat.php
        AddHandler application/x-httpd-php .php
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>
    
    # SquidAnalyzer
    <Directory "/var/www/proxymon/squidanalyzer/output">
        DirectoryIndex index.html
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>

    <Directory "/var/www/proxymon/squidanalyzer/resources">
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>
    
    # Logview
    <Directory "/var/www/proxymon/logview">
        DirectoryIndex index.php
        Options +FollowSymLinks
        AddHandler application/x-httpd-php .php
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>
    
    # SquidAI
    Alias /squidai "/var/www/proxymon/squidai"
    <Directory "/var/www/proxymon/squidai">
        DirectoryIndex index.html
        Options +FollowSymLinks
        AddHandler application/x-httpd-php .php
        AllowOverride None
        Require ip 192.168.0.0/24 127.0.0.1
    </Directory>

    SetEnvIf Request_URI "^/sqstat/sqstat\.php$" dontlog
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:"
    ErrorLog ${APACHE_LOG_DIR}/proxymon_error.log
    CustomLog ${APACHE_LOG_DIR}/proxymon_access.log combined env=!dontlog
</VirtualHost>
